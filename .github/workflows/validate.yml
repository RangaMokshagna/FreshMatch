name: Validate FreshMatch
on: [push, pull_request]
jobs:
  train-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLCONFIGDIR: /tmp/freshmatch-matplotlib
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python scripts/sync_notebook.py --check
      - run: python scripts/train.py --data-source synthetic
      - run: python -m unittest discover -s tests -v
